<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Soverter: right-click a video, pick a preset, get the result next to it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14151A"/>
      <stop offset="1" stop-color="#262a4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>

  <!-- owl -->
  <g transform="translate(70,70) scale(0.82)">
    <path d="M30 14 L92 58 Q128 48 164 58 L226 14 Q248 90 238 150 Q226 244 128 244 Q30 244 18 150 Q8 90 30 14 Z" fill="#5B6CFF"/>
    <circle cx="84" cy="134" r="52" fill="#FFFFFF"/><circle cx="172" cy="134" r="52" fill="#FFFFFF"/>
    <path d="M70 112 L70 156 L106 134 Z" fill="#23262E" stroke="#23262E" stroke-width="10" stroke-linejoin="round"/>
    <rect x="148" y="116" width="11" height="36" rx="5" fill="#23262E"/><rect x="167" y="108" width="11" height="52" rx="5" fill="#23262E"/><rect x="186" y="120" width="11" height="28" rx="5" fill="#23262E"/>
    <path d="M110 178 L146 178 L128 216 Z" fill="#23262E"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="300" y="165" font-size="76" font-weight="700" fill="#E6E8F0">Soverter</text>
    <text x="302" y="212" font-size="26" fill="#B6BBCE">Right-click a video. Pick a preset.</text>
    <text x="302" y="248" font-size="26" fill="#B6BBCE">The converted file lands next to it.</text>
    <text x="302" y="294" font-size="18" fill="#8d93ff" letter-spacing="1">FFMPEG  ·  WINDOWS 11 MENU  ·  NATIVE UI  ·  GPL-3.0</text>
  </g>

  <!-- context menu mock -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" filter="url(#shadow)">
    <rect x="860" y="52" width="360" height="256" rx="14" fill="#1C1E26" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="872" y="64" width="336" height="44" rx="8" fill="#5B6CFF" fill-opacity="0.28"/>
    <rect x="886" y="75" width="22" height="22" rx="5" fill="#5B6CFF"/>
    <path d="M893 80 L893 92 L903 86 Z" fill="#fff"/>
    <text x="920" y="93" font-size="19" font-weight="600" fill="#E6E8F0">Convert with Soverter</text>
    <path d="M1186 80 L1194 86 L1186 92" fill="none" stroke="#B6BBCE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="892" y="148" font-size="18" fill="#B6BBCE">4:3 → 16:9 (FHD)</text>
    <text x="892" y="186" font-size="18" fill="#B6BBCE">Volume −6 dB</text>
    <text x="892" y="224" font-size="18" fill="#B6BBCE">30 fps</text>
    <text x="892" y="262" font-size="18" fill="#B6BBCE">Re-encode to H.265</text>
    <path d="M876 292 L1204 292" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
