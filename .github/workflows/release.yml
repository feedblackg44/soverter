# Release build: unsigned menu package -> SignPath -> exe with the signed package -> SignPath -> GitHub Release.
# DRAFT, not run yet: it needs a SignPath Foundation project. Set in the repository settings:
#   vars.SIGNPATH_ORGANIZATION_ID, vars.SIGNPATH_PROJECT_SLUG, vars.SIGNPATH_SIGNING_POLICY_SLUG,
#   vars.SIGNPATH_PUBLISHER   (Subject of the SignPath certificate: it must equal Publisher in the MSIX manifest),
#   secrets.SIGNPATH_API_TOKEN.
# In SignPath define two artifact configurations: "msix" (a single .msix, Authenticode) and "exe" (a single .exe).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      # 1. menu package, unsigned; Publisher must match the certificate SignPath signs with
      - name: Build unsigned menu package
        shell: pwsh
        run: ./shellext/package.ps1 -Unsigned -Publisher "${{ vars.SIGNPATH_PUBLISHER }}" -Version "${{ steps.ver.outputs.version }}.0"
      - uses: actions/upload-artifact@v4
        id: msix-unsigned
        with:
          name: msix-unsigned
          path: internal/shellext/assets/soverter.msix
      - name: Sign the package
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: msix
          github-artifact-id: ${{ steps.msix-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-msix
      - name: Put the signed package where go:embed expects it
        shell: pwsh
        run: Copy-Item signed-msix/soverter.msix internal/shellext/assets/soverter.msix -Force

      # 2. exe with the signed package inside (no .cer: users get no trust step)
      - name: Build exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/unsigned/soverter.exe ./cmd/soverter
      - uses: actions/upload-artifact@v4
        id: exe-unsigned
        with:
          name: exe-unsigned
          path: dist/unsigned/soverter.exe
      - name: Sign the exe
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.exe-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Force -Path signed-exe/soverter.exe -DestinationPath "dist/soverter-${{ steps.ver.outputs.version }}-windows-x64.zip"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --generate-notes signed-exe/soverter.exe "dist/soverter-${{ steps.ver.outputs.version }}-windows-x64.zip"
